<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NADLANFIX - חיפוש נכס</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page active" id="search-page">
    <nav class="navbar">
      <div class="navbar-content">
        <a href="#" class="navbar-brand" onclick="showPage('index-page'); return false;">
          <div class="navbar-brand-icon">N</div>
          <span>NADLANFIX</span>
        </a>
        <div class="navbar-user">
          <span class="navbar-user-name" id="user-name">משתמש</span>
          <button class="btn btn-ghost" onclick="logout(); showPage('index-page');">התנתק</button>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div style="max-width: 600px; margin: 0 auto;">
          <div class="text-center mb-3">
            <h2>חיפוש נכס</h2>
            <p style="color: var(--gray-600); margin-top: 8px;">הזן פרטי הנכס שברצונך לחפש</p>
          </div>

          <div class="card">
            <form id="search-form">
              <div id="error-message" class="hidden" style="background: #ffebee; color: var(--error); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.9rem;"></div>

              <div class="form-group">
                <label class="form-label">עיר *</label>
                <select id="search-city" class="form-select" required>
                  <option value="">בחר עיר</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label">רחוב</label>
                <input type="text" id="search-street" class="form-input" placeholder="הכנס שם רחוב">
              </div>

              <div class="form-group">
                <label class="form-label">מספר</label>
                <input type="text" id="search-number" class="form-input" placeholder="הכנס מספר בית">
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                המשך
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
