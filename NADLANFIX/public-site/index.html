<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title="NADLANFIX - התחברות</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="page active" id="index-page">
    <div class="hero">
      <div class="hero-content">
        <div class="navbar-brand-icon" style="margin: 0 auto 24px; width: 80px; height: 80px; font-size: 2.5rem;">N</div>
        <h1 class="hero-title">NADLANFIX</h1>
        <p class="hero-subtitle">פלטפורמת נדל"ן חכמה - גישה למאגר הנתונים המתקדם בישראל</p>

        <div class="card" style="max-width: 420px; margin: 0 auto; text-align: right;">
          <form id="login-form">
            <div id="error-message" class="hidden" style="background: #ffebee; color: var(--error); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.9rem;"></div>

            <div class="form-group">
              <label class="form-label">שם משתמש</label>
              <input type="text" id="login-username" class="form-input" placeholder="הכנס שם משתמש" autocomplete="username">
            </div>

            <div class="form-group">
              <label class="form-label">סיסמה</label>
              <input type="password" id="login-password" class="form-input" placeholder="הכנס סיסמה" autocomplete="current-password">
            </div>

            <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%;">
              התחברות
            </button>
          </form>

          <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--gray-200);">
            <p style="font-size: 0.875rem; color: var(--gray-600);">
              עדיין אין לך חשבון? <a href="#" style="color: var(--gold-500); text-decoration: none; font-weight: 600;">צור קשר</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
